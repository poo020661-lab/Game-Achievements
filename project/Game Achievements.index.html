<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صيّاد التروفيات | شروحات جمع التروفيات في الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f1ec; --surface:#ffffff; --text:#1b2330; --muted:#5d6675; --line:#d9d5cb;
    --bronze:#b0703a; --silver:#7d8794; --gold:#c9951a; --platinum:#2f8fa8;
    --accent:#1b2330; --accent-text:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10151d; --surface:#18202b; --text:#eceff4; --muted:#9aa5b5; --line:#2a3544;
      --bronze:#d08a52; --silver:#a3adba; --gold:#e3b23c; --platinum:#58b8d1;
      --accent:#e3b23c; --accent-text:#10151d;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Readex Pro',Tahoma,Arial,sans-serif;line-height:1.8}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--platinum);outline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header.top{border-bottom:1px solid var(--line);background:var(--surface)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:1.15rem;text-decoration:none}
  .navbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  nav a{margin-inline-start:18px;text-decoration:none;color:var(--muted);font-size:.95rem}
  nav a:hover{color:var(--text)}
  #langBtn{font:inherit;font-size:.9rem;font-weight:600;margin-inline-start:18px;padding:6px 16px;border-radius:20px;border:1px solid var(--line);background:var(--accent);color:var(--accent-text);cursor:pointer}
  #langBtn:hover{opacity:.9}

  .hero{padding:64px 0 40px}
  .hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.25;margin:0 0 16px;font-weight:700;max-width:16ch}
  .hero p{max-width:52ch;color:var(--muted);font-size:1.1rem;margin:0 0 28px}
  .ladder{display:flex;gap:0;max-width:560px;height:14px;border-radius:7px;overflow:hidden}
  .ladder span{flex:1}
  .ladder .b{background:var(--bronze)}.ladder .s{background:var(--silver)}
  .ladder .g{background:var(--gold)}.ladder .p{background:var(--platinum)}
  .ladder-labels{display:flex;max-width:560px;font-size:.85rem;color:var(--muted);margin-top:6px}
  .ladder-labels span{flex:1}

  section{padding:36px 0}
  h2{font-size:1.6rem;margin:0 0 20px}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .filters input,.filters select{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
  .filters input{flex:1;min-width:200px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;border-top:5px solid var(--tier)}
  .card[data-tier="bronze"]{--tier:var(--bronze)}
  .card[data-tier="silver"]{--tier:var(--silver)}
  .card[data-tier="gold"]{--tier:var(--gold)}
  .card[data-tier="platinum"]{--tier:var(--platinum)}
  .video{aspect-ratio:16/9;background:#000}
  .video iframe,.video video{width:100%;height:100%;border:0;display:block}
  .ph{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,hsl(var(--h) 45% 30%),hsl(var(--h) 55% 13%));color:#fff;text-decoration:none;text-align:center;padding:16px}
  .ph strong{font-size:1.25rem;line-height:1.4}
  .ph span{font-size:.85rem;opacity:.85;border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:2px 12px}
  .thumb{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:#000;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
  .thumb:hover img{opacity:.85}
  .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.65);border:3px solid #fff}
  .play::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-35%,-50%);border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
  .card .body{padding:16px 18px 20px}
  .tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--tier);margin-bottom:4px}
  .card h3{margin:0 0 6px;font-size:1.1rem}
  .card p{margin:0;color:var(--muted);font-size:.95rem}
  .meta{margin-top:10px;font-size:.85rem;color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

  .tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .tip{padding:18px 20px;border-inline-start:4px solid var(--gold);background:var(--surface);border-radius:6px}
  .tip h3{margin:0 0 6px;font-size:1.05rem}
  .tip p{margin:0;color:var(--muted);font-size:.95rem}

  footer{border-top:1px solid var(--line);margin-top:30px;padding:24px 0;color:var(--muted);font-size:.9rem}

  @media (prefers-reduced-motion: no-preference){
    .ladder span{transform-origin:right;animation:grow .9s ease-out both}
    [dir="ltr"] .ladder span{transform-origin:left}
    .ladder span:nth-child(2){animation-delay:.12s}
    .ladder span:nth-child(3){animation-delay:.24s}
    .ladder span:nth-child(4){animation-delay:.36s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#" data-i18n="logo"></a>
    <div class="navbox">
      <nav>
        <a href="#videos" data-i18n="navVideos"></a>
        <a href="#tips" data-i18n="navTips"></a>
        <a href="#about" data-i18n="navAbout"></a>
      </nav>
      <button id="langBtn" type="button"></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-i18n="h1"></h1>
      <p data-i18n="heroP"></p>
      <div class="ladder" aria-hidden="true"><span class="b"></span><span class="s"></span><span class="g"></span><span class="p"></span></div>
      <div class="ladder-labels"><span data-i18n="bronze"></span><span data-i18n="silver"></span><span data-i18n="gold"></span><span data-i18n="platinum"></span></div>
    </div>

    <section id="videos">
      <h2 data-i18n="videosH"></h2>
      <div class="filters">
        <input type="search" id="search">
        <select id="tierFilter">
          <option value="all" data-i18n="allTiers"></option>
          <option value="bronze" data-i18n="bronze"></option>
          <option value="silver" data-i18n="silver"></option>
          <option value="gold" data-i18n="gold"></option>
          <option value="platinum" data-i18n="platinum"></option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden data-i18n="empty"></div>
    </section>

    <section id="tips">
      <h2 data-i18n="tipsH"></h2>
      <div class="tips">
        <div class="tip"><h3 data-i18n="tip1h"></h3><p data-i18n="tip1p"></p></div>
        <div class="tip"><h3 data-i18n="tip2h"></h3><p data-i18n="tip2p"></p></div>
        <div class="tip"><h3 data-i18n="tip3h"></h3><p data-i18n="tip3p"></p></div>
      </div>
    </section>

    <section id="about">
      <h2 data-i18n="aboutH"></h2>
      <p style="max-width:60ch;color:var(--muted)" data-i18n="aboutP"></p>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="yr"></span> <span data-i18n="footer"></span></div>
</footer>

<script>
/* ============================================================
   النصوص / UI strings
   ============================================================ */
const UI = {
  ar: {

    logo:"صيّاد التروفيات", navVideos:"الشروحات", navTips:"نصائح", navAbout:"عن الموقع",

    bronze:"برونزية", silver:"فضية", gold:"ذهبية", platinum:"بلاتينية",

    tip2h:"احفظ نسخ متعددة", tip2p:"استخدم أكثر من ملف حفظ قبل القرارات المهمة في القصة.",

    watch:"شاهد الشروحات على يوتيوب", play:"تشغيل", difficulty:"الصعوبة", time:"الوقت", langBtn:"English"
  },
  en: {
    pageTitle:"Trophy Hunter | Trophy Guides for Your Games",
    logo:"Trophy Hunter", navVideos:"Guides", navTips:"Tips", navAbout:"About",

    heroP:"Video guides for every tough trophy, from Bronze to Platinum, with steps and tips that save you time.",
    bronze:"Bronze", silver:"Silver", gold:"Gold", platinum:"Platinum",
    videosH:"Trophy Guides", searchPh:"Search for a game or trophy", allTiers:"All tiers",
    empty:"No results. Try another keyword or change the trophy tier.",
    tipsH:"Tips before you start",
    tip1h:"Start with the trophy list", tip1p:"Read the trophy list before playing so you know what you could miss and can't go back to.",
    tip2h:"Keep multiple saves", tip2p:"Use more than one save file before major story decisions.",
    tip3h:"Don't start with the hardest game", tip3p:"Order your games from easiest to hardest and grab the easy Platinums first.",
    aboutH:"About",
    aboutP:"A site that collects video guides and info on how to earn trophies in games. We keep adding new guides. Created by Abdullah Mohammed Fuhaid Al-Ajmi.",
    footer:"Trophy Hunter, by Abdullah Mohammed Fuhaid Al-Ajmi. All game names and trademarks belong to their respective owners.",
    watch:"Watch guides on YouTube", play:"Play", difficulty:"Difficulty", time:"Time", langBtn:"العربية"
  }
};

/* ============================================================
   أضف فيديوهاتك هنا. انسخ أي كتلة { ... } وعدّل عليها.
   Add your videos here. Copy any { ... } block and edit it.
   كل نص ثنائي اللغة: [عربي, English]
   إذا src فاضية يظهر زر يفتح بحث يوتيوب (حسب search). حط رقم الفيديو في src ليظهر الفيديو داخل الموقع.
   tier:  bronze | silver | gold | platinum
   type:  "youtube" → ضع رقم الفيديو فقط في src (مثال: dQw4w9WgXcQ)
          "file"    → ضع مسار الفيديو في src    (مثال: videos/elden-ring.mp4)
   ============================================================ */
const PG   = ["دليل البلاتينية","Platinum Trophy Guide"];
const MID  = ["متوسط","Medium"];
const HARD = ["صعب","Hard"];
const EASY = ["سهل إلى متوسط","Easy to Medium"];

const VIDEOS = [
  {
    game: "God of War Ragnarök",
    title: ["دليل البلاتينية الكامل","Complete Platinum Guide"],
    description: ["٣٦ تروفي، بدون تروفيات تفوتك، وكلها أوفلاين. مناسبة كبداية.","36 trophies, none missable, all offline. A great starter Platinum."],
    tier: "platinum", difficulty: ["٤ من ١٠","4 out of 10"], time: ["٤٠–٥٠ ساعة","40–50 hours"],
    type: "youtube", src: "zTD3GAmVlDE", hue: 8,
    search: "God of War Ragnarok platinum trophy guide"
  },
  {
    game: "God of War Ragnarök",
    title: ["شرح البلاتينية خطوة بخطوة (الجزء ١)","Step-by-Step Platinum Walkthrough (Part 1)"],
    description: ["سلسلة كاملة تغطي اللعبة والعناصر المطلوبة للبلاتينية.","A full series covering the game and everything needed for the Platinum."],
    tier: "gold", difficulty: MID, type: "youtube", src: "6KMxsWCTiA4", hue: 0,
    search: "God of War Ragnarok platinum walkthrough"
  },
  {
    game: "God of War (2018)", title: PG,
    description: ["شرح التروفيات والعناصر المطلوبة.","Trophies and required collectibles explained."],
    tier: "gold", difficulty: MID, type: "youtube", src: "", hue: 18,
    search: "God of War 2018 platinum trophy guide"
  },
  {
    game: "Elden Ring",
    title: ["دليل البلاتينية وتجنب التروفيات اللي تفوتك","Platinum Guide & Avoiding Missable Trophies"],
    description: ["فيها تروفيات تفوتك مرتبطة بالنهايات ومهام الشخصيات، فخطط قبل ما تبدأ.","Has missable trophies tied to endings and NPC quests, so plan before you start."],
    tier: "platinum", difficulty: HARD, type: "youtube", src: "", hue: 350,
    search: "Elden Ring platinum trophy guide missable"
  },
  {
    game: "Marvel's Spider-Man", title: PG,
    description: ["جمع العناصر وإكمال النشاطات.","Collecting items and completing activities."],
    tier: "silver", difficulty: MID, type: "youtube", src: "", hue: 215,
    search: "Marvel's Spider-Man platinum trophy guide"
  },
  {
    game: "Marvel's Spider-Man: Miles Morales", title: PG,
    description: ["شرح التروفيات والنشاطات.","Trophies and activities explained."],
    tier: "silver", difficulty: EASY, type: "youtube", src: "", hue: 190,
    search: "Spider-Man Miles Morales platinum trophy guide"
  },
  {
    game: "Horizon Zero Dawn", title: PG,
    description: ["إكمال المهام والتحديات وجمع العناصر.","Finishing quests, challenges, and collecting items."],
    tier: "silver", difficulty: MID, type: "youtube", src: "", hue: 25,
    search: "Horizon Zero Dawn platinum trophy guide"
  },
  {
    game: "Horizon Forbidden West", title: PG,
    description: ["شرح التروفيات والمهام الجانبية.","Trophies and side quests explained."],
    tier: "gold", difficulty: MID, type: "youtube", src: "", hue: 160,
    search: "Horizon Forbidden West platinum trophy guide"
  },
  {
    game: "The Last of Us Part II", title: PG,
    description: ["إكمال اللعبة على مستويات صعوبة وجمع العناصر.","Beating the game on multiple difficulties and collecting items."],
    tier: "gold", difficulty: ["متوسط إلى صعب","Medium to Hard"], type: "youtube", src: "", hue: 0,
    search: "The Last of Us Part 2 platinum trophy guide"
  },
  {
    game: "The Last of Us Part I", title: PG,
    description: ["شرح التروفيات والعناصر.","Trophies and collectibles explained."],
    tier: "gold", difficulty: MID, type: "youtube", src: "", hue: 340,
    search: "The Last of Us Part 1 platinum trophy guide"
  },
  {
    game: "Ghost of Tsushima", title: PG,
    description: ["شرح التروفيات والمهام والمناطق.","Trophies, quests, and regions explained."],
    tier: "silver", difficulty: MID, type: "youtube", src: "", hue: 5,
    search: "Ghost of Tsushima platinum trophy guide"
  },
  {
    game: "Uncharted 4", title: PG,
    description: ["شرح التروفيات وجمع الكنوز.","Trophies and treasure hunting explained."],
    tier: "silver", difficulty: MID, type: "youtube", src: "", hue: 30,
    search: "Uncharted 4 platinum trophy guide"
  },
  {
    game: "Bloodborne", title: PG,
    description: ["شرح التروفيات والنهايات.","Trophies and endings explained."],
    tier: "platinum", difficulty: HARD, type: "youtube", src: "", hue: 285,
    search: "Bloodborne platinum trophy guide"
  },

  /* ---------- ألعاب جديدة / New games ---------- */
  {
    game: "Astro Bot", title: PG,
    description: ["جمع كل الروبوتات والقطع الخاصة. لعبة ممتعة وبلاتينيتها سهلة نسبيًا.","Rescue every bot and find all special pieces. Fun game with a fairly easy Platinum."],
    tier: "silver", difficulty: EASY, type: "youtube", src: "", hue: 200,
    search: "Astro Bot platinum trophy guide"
  },
  {
    game: "Red Dead Redemption 2", title: PG,
    description: ["تحديات كثيرة وصيد وجمع، وتحتاج صبر وتخطيط.","Lots of challenges, hunting, and collecting. Needs patience and planning."],
    tier: "gold", difficulty: ["متوسط إلى صعب","Medium to Hard"], type: "youtube", src: "", hue: 12,
    search: "Red Dead Redemption 2 platinum trophy guide"
  },
  {
    game: "Cyberpunk 2077", title: PG,
    description: ["تروفيات مرتبطة بالنهايات والمهام الجانبية، فاحفظ قبل القرارات الكبيرة.","Trophies tied to endings and side jobs, so save before big decisions."],
    tier: "gold", difficulty: MID, type: "youtube", src: "", hue: 55,
    search: "Cyberpunk 2077 platinum trophy guide"
  },
  {

    tier: "gold", difficulty: MID, type: "youtube", src: "", hue: 260,
    search: "Hogwarts Legacy platinum trophy guide"
  }
];

/* ============================================================ */
let lang = 'ar';
try { const s = localStorage.getItem('lang'); if (s === 'en' || s === 'ar') lang = s; } catch(e){}

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const tierFilter = document.getElementById('tierFilter');
const langBtn = document.getElementById('langBtn');
const L = i => i[lang === 'ar' ? 0 : 1];
const t = k => UI[lang][k];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function mediaHTML(v){
  const title = L(v.title);
  if(v.type === 'youtube' && !v.src){
    const q = encodeURIComponent(v.search || (v.game + ' ' + title));
    return `<a class="ph" style="--h:${v.hue||0}" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener"><strong>${esc(v.game)}</strong><span>${esc(t('watch'))}</span></a>`;
  }
  if(v.type === 'youtube'){
    const id = encodeURIComponent(v.src);
    return `<button class="thumb" type="button" data-id="${id}" data-title="${esc(title)}" aria-label="${esc(t('play'))}: ${esc(title)}">
      <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy">
      <span class="play" aria-hidden="true"></span>
    </button>`;
  }
  return `<video controls preload="metadata" ${v.poster ? 'poster="'+esc(v.poster)+'"' : ''} src="${esc(v.src)}"></video>`;
}

grid.addEventListener('click', e => {
  const b = e.target.closest('.thumb');
  if(!b) return;
  const box = b.parentElement;
  box.innerHTML = `<iframe src="https://www.youtube.com/embed/${b.dataset.id}?autoplay=1&rel=0" title="${b.dataset.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  const f = box.querySelector('iframe'); if(f) f.focus();
});

function render(){
  const q = search.value.trim().toLowerCase();
  const tf = tierFilter.value;
  const list = VIDEOS.filter(v =>
    (tf === 'all' || v.tier === tf) &&
    (v.game + ' ' + v.title.join(' ') + ' ' + v.description.join(' ')).toLowerCase().includes(q)
  );
  grid.innerHTML = list.map(v => `
    <article class="card" data-tier="${esc(v.tier)}">
      <div class="video">${mediaHTML(v)}</div>
      <div class="body">
        <span class="tag">${esc(t(v.tier))} · ${esc(v.game)}</span>
        <h3>${esc(L(v.title))}</h3>
        <p>${esc(L(v.description))}</p>
        <div class="meta">${esc(t('difficulty'))}: ${esc(L(v.difficulty))}${v.time ? ' — ' + esc(t('time')) + ': ' + esc(L(v.time)) : ''}</div>
      </div>
    </article>`).join('');
  empty.hidden = list.length > 0;
}

function applyLang(){
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  search.placeholder = t('searchPh');
  search.setAttribute('aria-label', t('searchPh'));
  tierFilter.setAttribute('aria-label', t('allTiers'));
  langBtn.textContent = t('langBtn');
  langBtn.setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
  render();
}
